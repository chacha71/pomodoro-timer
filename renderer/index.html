<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400">
<title>番茄钟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 噪点纹理 (SVG filter) -->
<svg class="noise-svg" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</svg>

<div class="container">
  <!-- 模式切换 -->
  <div class="mode-tabs" role="tablist">
    <button class="mode-tab active" data-mode="pomodoro" role="tab">专注</button>
    <button class="mode-tab" data-mode="shortBreak" role="tab">短休</button>
    <button class="mode-tab" data-mode="longBreak" role="tab">长休</button>
  </div>

  <!-- 圆形计时器 -->
  <div class="timer-wrap" id="timerWrap">
    <svg viewBox="0 0 280 280" class="timer-ring">
      <defs>
        <linearGradient id="ringActive" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="var(--ring-from)"/>
          <stop offset="100%" stop-color="var(--ring-to)"/>
        </linearGradient>
        <linearGradient id="ringRest" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="var(--ring-rest-from)"/>
          <stop offset="100%" stop-color="var(--ring-rest-to)"/>
        </linearGradient>
        <filter id="ringGlow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle class="ring-bg" cx="140" cy="140" r="120"/>
      <circle class="ring-progress" cx="140" cy="140" r="120"
        stroke-dasharray="753.98" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-center">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-label" id="timerStatus">准备开始</div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button class="btn-icon" id="resetBtn" title="重置 (R)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button class="btn-primary" id="mainBtn">开始</button>
    <button class="btn-icon" id="closeBtn" title="最小化到托盘 (Esc)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="todayCount">0</span>
      <span class="stat-lbl">今日专注</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-num" id="totalCount">0</span>
      <span class="stat-lbl">累计番茄</span>
    </div>
  </div>

  <!-- 底部提示 -->
  <div class="footer-hint">
    <span class="hint-key">空格</span> 开始/暂停
    <span class="hint-dot">·</span>
    <span class="hint-key">R</span> 重置
    <span class="hint-dot">·</span>
    <span class="hint-key">Esc</span> 托盘
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
